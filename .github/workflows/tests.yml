name: tests

on:
  push:
    branches: ["main", "refactor/node-remotion-single-plan", "feat/studio-ui-scene-workspace", "feat/complete-docs-skill-site"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check syntax of all backend modules
        run: |
          for file in server/*.mjs; do node --check "$file"; done
          node --check frontend/static/app.js
          node --check frontend/static/visual_editor.js
          node --check frontend/static/publications.js
      - name: Verify generated docs and figures match the installed schema
        run: node scripts/generate-docs.mjs --check
      - name: Run Node tests
        run: node --test server/*.test.mjs

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONTENTLAB_REMOTION_CONCURRENCY: "1"
      CONTENTLAB_FFMPEG_THREADS: "2"
      CONTENTLAB_COMPOSE_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Node dependencies
        run: npm install --no-audit --no-fund
      - name: Verify edge-trimmed sound cues and ripple narration
        run: node server/smoke-audio-sync.mjs
      - name: Require rendered 100ms fade and slide/blur pixel checks
        run: CONTENTLAB_REQUIRE_FFMPEG_TEST=1 node --test server/motion-visual.test.mjs server/compose.test.mjs
      - name: Install Remotion dependencies
        run: npm ci --prefix backend/remotion
      - name: Exercise live storyboard UI in headless Chrome
        env:
          CHROME_BIN: google-chrome
        run: |
          which google-chrome || true
          node server/smoke-ui.mjs
      - name: Save visual screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contentlab-studio-ui
          path: |
            /tmp/contentlab-studio-ui.png
            /tmp/contentlab-docs-ui.png
          if-no-files-found: ignore
      - name: Test HTTP server startup
        run: |
          node server/http.mjs >/tmp/contentlab-server.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 25); do
            curl -fsS http://127.0.0.1:5000/health && break || sleep 1
          done
          curl -fsS http://127.0.0.1:5000/ >/dev/null
      - name: Exercise HTTP editor API and skill ZIP
        run: node server/smoke-http.mjs
      - name: Verify local source import and media cuts
        run: node server/smoke-source.mjs
      - name: Verify native whisper.cpp adapter
        run: node server/smoke-transcription.mjs
      - name: End-to-end Remotion render and cache
        run: node server/smoke.mjs
      - name: Render programmable TSX motion example (531 frames)
        env:
          CONTENTLAB_TRUST_CUSTOM_TSX: "1"
        run: node server/smoke-custom-scene.mjs
      - name: Test vertical word carousel layout and transitions with real Remotion frames
        run: node server/smoke-word-stack.mjs
      - name: Smooth 100ms animations retain timeline and render all transition directions
        run: node server/smoke-motion.mjs
      - name: Two scenes, transitions, music, SFX and reuse
        run: node server/smoke-transitions.mjs
      - name: Detached launcher
        env:
          XDG_STATE_HOME: ${{ runner.temp }}
        run: |
          node server/launcher.mjs
          curl -fsS http://127.0.0.1:5000/health
          node server/launcher.mjs --stop

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse Windows bootstrap PowerShell without downloading dependencies
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "scripts/bootstrap-windows.ps1"), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw "PowerShell bootstrap possui erros de sintaxe"
          }
      - name: Install Node dependencies
        run: npm install --no-audit --no-fund
      - name: Test project and cache modules on Windows
        run: node --test server/*.test.mjs
      - name: Test Windows detached launcher
        shell: pwsh
        run: |
          node server/launcher.mjs
          Invoke-RestMethod http://127.0.0.1:5000/health
          node server/launcher.mjs --stop
