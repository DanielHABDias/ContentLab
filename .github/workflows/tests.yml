name: tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/remotion/package-lock.json

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Install Remotion dependencies
        run: npm ci --prefix backend/remotion

      - name: Run unit tests
        env:
          CONTENTLAB_REMOTION_CONCURRENCY: "1"
          CONTENTLAB_FFMPEG_THREADS: "2"
          CONTENTLAB_COMPOSE_THREADS: "2"
        run: python -m unittest discover -s tests -q
