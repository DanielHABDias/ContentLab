name: Generate TSX site documentation (temporary)
on:
  push:
    branches:
      - docs/tsx-custom-scenes-skills-20261013
permissions:
  contents: write
jobs:
  generate:
    if: github.repository == 'DanielHABDias/ContentLab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate HTML and Markdown on branch
        run: |
          set -euo pipefail
          node scripts/generate-docs.mjs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/Documentacao-ContentLab.md docs/Documentacao-ContentLab.html
          if ! git diff --cached --quiet; then
            git commit -m "docs: regenerate TSX scene guide for Studio site"
            git push origin HEAD:docs/tsx-custom-scenes-skills-20261013
          fi
