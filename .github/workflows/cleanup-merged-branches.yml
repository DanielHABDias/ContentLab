name: Limpar branches após merge

on:
  pull_request:
    types: [closed]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Excluir branches integradas sem tocar em main
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const candidates = new Set();
            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              if (pr.merged && pr.head.repo?.full_name === context.payload.repository.full_name)
                candidates.add(pr.head.ref);
            }
            if (context.eventName === 'push') {
              // Limpa as duas branches já integradas nesta migração.
              for (const number of [30, 31]) {
                const {data: pr} = await github.rest.pulls.get({...repo, pull_number: number});
                if (pr.merged_at && pr.head.repo?.full_name === context.payload.repository.full_name)
                  candidates.add(pr.head.ref);
              }
            }
            for (const name of candidates) {
              if (!/^feat\/[a-z0-9][a-z0-9/_-]+$/i.test(name) || ['main','develop'].includes(name)) continue;
              try {
                await github.rest.git.deleteRef({...repo, ref:'heads/'+name});
                core.info('Branch removida: '+name);
              } catch (error) {
                if (error.status === 404 || error.status === 422) {
                  core.info('Branch já removida ou indisponível: '+name);
                } else {
                  throw error;
                }
              }
            }
