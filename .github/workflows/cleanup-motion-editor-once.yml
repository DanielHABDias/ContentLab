name: One-time cleanup of merged editor branch
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-motion-editor-once.yml
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == 'DanielHABDias/ContentLab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Safely remove exactly the merged feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch='fix/editor-remove-legacy-motion-wizard-and-branding'
          expected='2b9c203458164cb96dde51214a2f7f44f02e9a30'
          current="$(git ls-remote origin "refs/heads/$branch" | awk '{print $1}')"
          if [[ -z "$current" ]]; then
            echo "Already removed: $branch"
            exit 0
          fi
          [[ "$current" == "$expected" ]] || { echo "::error::Branch has changed"; exit 1; }
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          git merge-base --is-ancestor "$expected" "$GITHUB_SHA" || { echo "::error::Branch not integrated"; exit 1; }
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
          echo "DELETED $branch"
