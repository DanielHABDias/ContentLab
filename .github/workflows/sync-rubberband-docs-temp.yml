name: Regenerate rubberband docs temporary
on:
  push:
    branches:
      - fix/bootstrap-rubberband-ffmpeg
permissions:
  contents: write
jobs:
  build:
    if: github.repository == 'DanielHABDias/ContentLab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate canonical documentation
        run: |
          set -euo pipefail
          node scripts/generate-docs.mjs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/Documentacao-ContentLab.md docs/Documentacao-ContentLab.html
          if ! git diff --cached --quiet; then
            git commit -m "docs: regenerate rubberband setup guidance"
            git push origin HEAD:fix/bootstrap-rubberband-ffmpeg
          fi
