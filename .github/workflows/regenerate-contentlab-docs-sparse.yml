name: Regenerar docs do Content Lab (sparse)

on:
  push:
    branches:
      - fix/contentlab-generated-html-layout

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Clone parcial somente do necessário
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config core.sparseCheckout true
          git config core.sparseCheckoutCone true
          git sparse-checkout init --cone
          git sparse-checkout set scripts server schemas scene-library docs
          git fetch --depth=1 --filter=blob:none origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Gerar documentação
        shell: bash
        run: |
          cd repo
          node scripts/generate-docs.mjs
      - name: Commitar HTML/Markdown gerados
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Documentacao-ContentLab.md docs/Documentacao-ContentLab.html docs/figures
          if git diff --cached --quiet; then
            echo "Documentação já sincronizada."
          else
            git commit -m "docs: regenerate Content Lab generated files"
            git push origin HEAD:fix/contentlab-generated-html-layout
          fi
