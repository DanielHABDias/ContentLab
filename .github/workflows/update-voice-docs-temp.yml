name: Generate refined voice docs (temporary)
on:
  push:
    branches:
      - fix/natural-bass-voice-presets
permissions:
  contents: write
jobs:
  generate:
    if: github.repository == 'DanielHABDias/ContentLab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate public docs from canonical docs content
        run: |
          set -euo pipefail
          node scripts/generate-docs.mjs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/Documentacao-ContentLab.md docs/Documentacao-ContentLab.html
          if ! git diff --cached --quiet; then
            git commit -m "docs: regenerate narration EQ and A/B guide"
            git push origin HEAD:fix/natural-bass-voice-presets
          fi
