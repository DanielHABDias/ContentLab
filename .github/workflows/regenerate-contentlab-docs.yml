name: Regenerar docs do Content Lab

on:
  push:
    branches:
      - fix/contentlab-generated-html-layout

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerar documentação
        run: node scripts/generate-docs.mjs
      - name: Commitar arquivos gerados
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Documentacao-ContentLab.md docs/Documentacao-ContentLab.html docs/figures
          if git diff --cached --quiet; then
            echo "Documentação já estava sincronizada."
          else
            git commit -m "docs: regenerate Content Lab generated files"
            git push origin HEAD:fix/contentlab-generated-html-layout
          fi
