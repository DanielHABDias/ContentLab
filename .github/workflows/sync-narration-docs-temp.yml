name: Generate narration studio docs (temporary)
on:
  push:
    branches: ["feat/narration-studio-before-editplan"]
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Synchronize public docs
        run: |
          set -euo pipefail
          node scripts/generate-docs.mjs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/Documentacao-ContentLab.md docs/Documentacao-ContentLab.html
          if ! git diff --cached --quiet; then
            git commit -m "docs: regenerate narrated-first Studio docs"
            git push origin HEAD:feat/narration-studio-before-editplan
          fi
