name: Node Migration

on:
  push:
    branches: [refactor/node-remotion-single-plan]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in server/*.mjs; do node --check "$file"; done
          node --check frontend/static/app.js
          node --check frontend/static/visual_editor.js
      - name: Test canonical JSON and cache
        run: node --test server/*.test.mjs

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CONTENTLAB_REMOTION_CONCURRENCY: "1"
      CONTENTLAB_FFMPEG_THREADS: "2"
      CONTENTLAB_COMPOSE_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Node server dependencies
        run: npm install --no-audit --no-fund
      - name: Install Remotion
        run: npm ci --prefix backend/remotion
      - name: Test HTTP server startup
        run: |
          node server/http.mjs >/tmp/contentlab-server.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 25); do
            curl -fsS http://127.0.0.1:5000/health && break || sleep 1
          done
          curl -fsS http://127.0.0.1:5000/ >/dev/null
      - name: Render a real scene and exercise persistent cache
        run: node server/smoke.mjs
