name: Regenerate generic TSX site guide (temporary)
on:
  push:
    branches:
      - docs/tsx-custom-scenes-skills-20261013
permissions:
  contents: write
jobs:
  sync:
    if: github.repository == 'DanielHABDias/ContentLab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Generate HTML and Markdown for Studio
        run: |
          set -euo pipefail
          node scripts/generate-docs.mjs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/Documentacao-ContentLab.md docs/Documentacao-ContentLab.html
          if ! git diff --cached --quiet; then
            git commit -m "docs: regenerate brand-neutral programmable-scene guide"
            git push origin HEAD:docs/tsx-custom-scenes-skills-20261013
          fi
